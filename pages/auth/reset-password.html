<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Choose a new password — Biscoon</title>
<meta name="description" content="Set a new Biscoon password from your email reset link."/>
<link rel="stylesheet" href="../../assets/css/main.css"/>
<link rel="stylesheet" href="../../assets/css/dash-nav.css"/>
<link rel="stylesheet" href="../../assets/css/pages/auth/login.css"/>
</head>
<body class="has-dash-nav">
<nav class="site-header">
  <a href="../../index.html" class="nav-logo logo-wrap" aria-label="Biscoon.com home">
    <span class="nav-wordmark logo-text" aria-hidden="true">Bis<span>coon</span>.com</span>
  </a>
  <div class="logo-np np">विश्व नेपालीको डिजिटल थलो</div>
  <div class="nav-links home-mini-links" aria-label="Primary">
    <a href="../jobs/jobs.html">Jobs</a>
    <a href="../housing/housing.html">Housing</a>
    <a href="login.html">Sign In</a>
  </div>
  <div class="hdr-right">
    <div class="nav-ctas" id="navCtas">
      <a class="btn-ghost hbtn ghost" href="login.html">Sign In</a>
    </div>
  </div>
  <button class="hamburger" id="hamburger" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobileDrawer"><span></span><span></span><span></span></button>
</nav>
<div class="mobile-drawer" id="mobileDrawer">
  <a href="login.html">Sign In</a>
</div>

<div class="breadcrumb">
  <a href="../../index.html">🏠 Biscoon</a>
  <span class="sep">›</span>
  <span aria-current="page">New password</span>
</div>
<section class="auth-page">
  <div class="auth-hero">
    <div class="auth-headline">New password</div>
    <p class="auth-subtitle">Choose a password of at least 8 characters. This link works once and expires in one hour.</p>
  </div>
  <div class="auth-layout auth-layout-single">
    <div class="auth-card">
      <form id="resetPasswordForm" action="#" method="post">
        <input type="hidden" id="token" name="token" />
        <div class="form-group">
          <label class="form-label required" for="email">Email</label>
          <input class="form-input" id="email" name="email" type="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label required" for="password">New password</label>
          <input class="form-input" id="password" name="password" type="password" minlength="8" required autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label class="form-label required" for="confirmPassword">Confirm password</label>
          <input class="form-input" id="confirmPassword" name="confirmPassword" type="password" minlength="8" required autocomplete="new-password" />
        </div>
        <div id="authMessage" class="form-helper"></div>
        <button class="btn-primary auth-button" type="submit">Save new password</button>
        <div class="auth-footer"><a href="forgot-password.html">Request a new link</a></div>
      </form>
    </div>
  </div>
</section>
<script src="../../assets/js/biscoon.js"></script>
<script src="../../assets/js/auth.js"></script>
</body>
</html>
