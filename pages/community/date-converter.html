<main class="tool-page">
  <p class="tool-kicker">Calendar</p>
  <h1>Date converter</h1>
  <p class="tool-lead">Switch between Gregorian (A.D.) and Bikram Sambat. Range: BS 2070–2090.</p>
  <div class="convert-grid">
    <section class="convert-card">
      <h2>Gregorian (AD)</h2>
      <label class="tool-label" for="adDate">Date</label>
      <input class="form-input" id="adDate" type="date"/>
      <button class="btn-primary" type="button" id="adToBs">Convert to BS</button>
    </section>
    <section class="convert-card">
      <h2>Bikram Sambat (BS)</h2>
      <div class="bs-row">
        <label>Year <input class="form-input" id="bsYear" type="number" min="2070" max="2090"/></label>
        <label>Month
          <select class="form-select" id="bsMonth">
            <option value="1">Baisakh</option>
            <option value="2">Jestha</option>
            <option value="3">Ashadh</option>
            <option value="4">Shrawan</option>
            <option value="5">Bhadra</option>
            <option value="6">Ashwin</option>
            <option value="7">Kartik</option>
            <option value="8">Mangsir</option>
            <option value="9">Poush</option>
            <option value="10">Magh</option>
            <option value="11">Falgun</option>
            <option value="12">Chaitra</option>
          </select>
        </label>
        <label>Day <input class="form-input" id="bsDay" type="number" min="1" max="32"/></label>
      </div>
      <button class="btn-ghost" type="button" id="bsToAd">Convert to AD</button>
    </section>
  </div>
  <p class="convert-out" id="convertOut"></p>
</main>
<script src="../../assets/js/biscoon.js"></script>
<script src="../../assets/js/date-converter.js"></script>
</body>
</html>
