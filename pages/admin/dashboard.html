<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Panel — Biscoon</title>
<link rel="stylesheet" href="../../assets/css/pages/admin/dashboard.css"/>
</head>
<body class="admin-body">
<div class="admin-layout">

  <aside class="admin-sidebar">
    <div class="admin-brand">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
        <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#C0392B" fill-opacity="0.18" stroke="#C0392B" stroke-width="1.5"/>
        <text x="16" y="21.5" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#C0392B">B</text>
      </svg>
      <span class="admin-brand-name">Biscoon</span>
      <span class="admin-brand-tag">ADMIN</span>
    </div>

    <nav class="admin-nav" id="adminNav">
      <button class="admin-nav-link" data-view="dashboard">
        <span class="admin-nav-icon">📊</span> Dashboard
      </button>
      <button class="admin-nav-link" data-view="users">
        <span class="admin-nav-icon">👥</span> Users
      </button>
      <button class="admin-nav-link" data-view="listings">
        <span class="admin-nav-icon">📋</span> Listings
      </button>
      <button class="admin-nav-link" data-view="discussions">
        <span class="admin-nav-icon">💬</span> Discussions
      </button>
      <button class="admin-nav-link" data-view="comments">
        <span class="admin-nav-icon">🗨️</span> Comments
      </button>
      <button class="admin-nav-link" data-view="announcements">
        <span class="admin-nav-icon">📢</span> Announcements
      </button>
    </nav>

    <div class="admin-sidebar-footer">
      <a class="admin-back-link" href="../../index.html">← Back to Biscoon</a>
      <button class="admin-logout-btn" id="adminLogout">Sign Out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div class="admin-topbar-title" id="viewTitle">Loading…</div>
      <div class="admin-topbar-user" id="adminName"></div>
    </div>
    <div class="admin-content" id="adminContent">
      <div class="admin-loading">Authenticating…</div>
    </div>
  </main>

</div>
<script src="../../assets/js/admin.js"></script>
</body>
</html>
