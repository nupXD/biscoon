<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Panel — Biscoon</title>
<meta name="description" content="Biscoon admin panel — manage users, listings, news, events, and community content."/>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32.png"/>
<link rel="shortcut icon" href="../../assets/favicon.ico"/>
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png"/>
<link rel="stylesheet" href="../../assets/css/pages/admin/dashboard.css"/>
<link rel="stylesheet" href="../../assets/vendor/photoswipe/photoswipe.css"/>
<link rel="stylesheet" href="../../assets/css/pages/admin/workspace.css">
<link rel="stylesheet" href="../../assets/css/forms.css">
<script src="../../assets/js/plugins/form-guidance.js" defer></script>
</head>
<body class="admin-body">
<a class="skip-link" href="#main">Skip to content</a>
<div class="admin-layout" id="adminLayout">

  <div class="admin-sidebar-backdrop" id="adminSidebarBackdrop"></div>

  <aside class="admin-sidebar">
    <div class="admin-brand">
      <a class="admin-brand-link" href="dashboard.html" aria-label="Biscoon Admin — go to dashboard">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
          <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#E63946" fill-opacity="0.18" stroke="#E63946" stroke-width="1.5"/>
          <text x="16" y="21.5" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#E63946">B</text>
        </svg>
        <span class="admin-brand-name">Biscoon</span>
        <span class="admin-brand-tag">ADMIN</span>
      </a>
      <button class="admin-sidebar-close" id="adminSidebarClose" type="button" aria-label="Close menu" title="Close menu">✕</button>
    </div>

    <nav class="admin-nav" id="adminNav">
<button class="admin-nav-link" data-view="dashboard">
        <span class="admin-nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z"/></svg></span><span class="admin-nav-label">Dashboard</span>
      </button>
<div class="admin-nav-group" role="group" aria-label="Content"><div class="admin-nav-group-title">Content</div>
<button class="admin-nav-link" data-view="listings">
        <span class="admin-nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18H5z M8 7h8 M8 12h8 M8 17h5"/></svg></span><span class="admin-nav-label">Listings</span>
      </button>
<button class="admin-nav-link" data-view="events">
        <span class="admin-nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v16H4z M4 10h16 M8 3v4 M16 3v4"/></svg></span><span class="admin-nav-label">Events</span>
      </button>
<button class="admin-nav-link" data-view="news">
        <span class="admin-nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v16H3z M6 7h5v5H6z M14 7h4 M14 11h4 M6 16h12"/></svg></span><span class="admin-nav-label">News</span>
      </button>
<button class="admin-nav-link" data-view="spotlight">
        <span class="admin-nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3z M10 9l5 3-5 3z"/></svg></span><span class="admin-nav-label">Spotlight</span>
        <span class="admin-nav-hint">Homepage alerts</span>
      </button>
<button class="admin-nav-link" data-view="announcements">
        <span class="admin-nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h5l12-6v16L8 14H3z M8 14l2 7"/></svg></span><span class="admin-nav-label">Announcements</span>
      </button></div>
<div class="admin-nav-group" role="group" aria-label="Community &amp; Moderation"><div class="admin-nav-group-title">Community &amp; Moderation</div>
<button class="admin-nav-link" data-view="discussions">
        <span class="admin-nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v13H8l-5 4z"/></svg></span><span class="admin-nav-label">Discussions</span>
      </button>
<button class="admin-nav-link" data-view="comments">
        <span class="admin-nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H9l-5 4z M8 8h8 M8 12h5"/></svg></span><span class="admin-nav-label">Comments</span>
      </button>
<button class="admin-nav-link" data-view="reports">
        <span class="admin-nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V3l14 2-3 5 3 5-14-2"/></svg></span><span class="admin-nav-label">Reports</span>
      <span class="admin-nav-count" id="reportsNavCount" hidden></span></button></div>
<div class="admin-nav-group" role="group" aria-label="Administration"><div class="admin-nav-group-title">Administration</div>
<button class="admin-nav-link" data-view="users">
        <span class="admin-nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M18 8h4 M20 6v4"/></svg></span><span class="admin-nav-label">Users</span>
      </button>
<button class="admin-nav-link" data-view="audit">
        <span class="admin-nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18H5z M8 7h8 M8 11h8 M8 15h5"/></svg></span><span class="admin-nav-label">Audit Logs</span>
      </button>
<button class="admin-nav-link" data-view="trash">
        <span class="admin-nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18 M9 6V3h6v3 M6 6l1 15h10l1-15 M10 10v7 M14 10v7"/></svg></span><span class="admin-nav-label">Trash</span>
      </button></div>
    </nav>

    <div class="admin-sidebar-footer">
      <a class="admin-back-link" href="../../index.html"><span>←</span><span class="admin-footer-label">Back to Biscoon</span></a>
      <button class="admin-logout-btn" id="adminLogout"><span>⏻</span><span class="admin-footer-label">Sign Out</span></button>
    </div>
  </aside>

  <main class="admin-main" id="main" tabindex="-1">
    <div class="admin-topbar">
      <div class="admin-topbar-main">
        <button class="admin-icon-btn admin-sidebar-toggle" id="adminSidebarToggle" type="button" aria-label="Toggle navigation" title="Toggle navigation">☰</button>
        <div>
          <h1 class="admin-topbar-title" id="viewTitle">Loading…</h1>
          <div class="admin-topbar-hint" id="viewHint">Preparing admin workspace</div>
        </div>
      </div>
      <div class="admin-topbar-actions">
        <button class="admin-icon-btn admin-search-trigger" id="adminSearchTrigger" type="button" aria-label="Search (⌘K)" title="Global search (⌘K)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="admin-icon-btn" id="adminRefreshView" type="button" aria-label="Refresh current view" title="Refresh current view">↻</button>
        <div class="admin-topbar-user">
          <span class="admin-status-dot" aria-hidden="true"></span>
          <span id="adminName"></span>
        </div>
      </div>
    </div>
    <div class="admin-content" id="adminContent">
      <div class="admin-loading">Authenticating…</div>
    </div>
  </main>

</div>
<script src="../../assets/js/admin.js"></script>
<script src="../../assets/js/plugins/news-editor.js"></script>
<script src="../../assets/js/plugins/listing-lightbox.js" data-biscoon-plugin="listing-lightbox" defer></script>
</body>
</html>
